{% extends "base.html" %}
{% block title %}系统状态 · Moon监管中心{% endblock %}
{% block content %}
<section class="page-heading compact-heading"><div><p class="eyebrow">SYSTEM</p><h1>Mac mini 状态</h1><p>服务、资源、数据库与安全开关。</p></div></section>
<section id="system-cards" class="stats-grid system-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
<section class="content-grid system-content">
  <article class="panel"><div class="panel-heading"><div><h2>进程状态</h2><p>Web与双行情模拟服务</p></div></div><dl id="process-status" class="decision-list"></dl></article>
  <article class="panel"><div class="panel-heading"><div><h2>盘口采集器</h2><p id="collector-summary">—</p></div></div><dl id="collector-status" class="decision-list"></dl></article>
  <article class="panel"><div class="panel-heading"><div><h2>安全状态</h2><p>硬性交易保护</p></div></div><div class="safety-stack"><div><span class="status-dot green"></span><strong>LIVE_TRADING=false</strong></div><div><span class="status-dot green"></span><strong>订单提交不可用</strong></div><div><span class="status-dot green"></span><strong>admin只读监管</strong></div></div></article>
</section>
{% endblock %}
