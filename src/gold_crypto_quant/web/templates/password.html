<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>设置管理员密码</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand auth-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span><span><strong>Moon</strong><small>安全设置</small></span></div>
    <div class="auth-heading"><h1>设置新密码</h1><p>首次登录必须更换一次性密码，至少12个字符。</p></div>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form action="/password" method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>当前密码<input name="current_password" type="password" autocomplete="current-password" required></label>
      <label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label>
      <label>再次输入<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label>
      <button class="primary-button" type="submit">保存并进入后台</button>
    </form>
  </main>
</body>
</html>
