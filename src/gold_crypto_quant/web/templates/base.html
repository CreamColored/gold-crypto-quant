<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Moon监管中心{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ static_version() }}">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"
          integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss"
          crossorigin="anonymous" defer></script>
  <script src="{{ url_for('static', path='/app.js') }}?v={{ static_version() }}" defer></script>
</head>
<body data-page="{{ active_page }}">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span>
        <span><strong>Moon</strong><small>监管中心</small></span>
      </a>
      <nav class="nav-list" aria-label="主要导航">
        <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}"><span>⌂</span>总览</a>
        <a href="/market" class="nav-item {% if active_page == 'market' %}active{% endif %}"><span>⌁</span>实时行情</a>
        <a href="/trades" class="nav-item {% if active_page == 'trades' %}active{% endif %}"><span>⇄</span>交易记录</a>
        <a href="/accounts" class="nav-item {% if active_page == 'accounts' %}active{% endif %}"><span>◎</span>账户权益</a>
        <a href="/trading" class="nav-item {% if active_page == 'trading' %}active{% endif %}"><span>⏻</span>交易配置</a>
        <a href="/system" class="nav-item {% if active_page == 'system' %}active{% endif %}"><span>◇</span>系统状态</a>
      </nav>
      <div class="sidebar-safety">
        <span class="status-dot green"></span>
        <div><strong>只读监管</strong><small>LIVE_TRADING=false</small></div>
      </div>
      <div class="admin-menu">
        <div class="avatar">A</div>
        <div class="admin-copy"><strong>{{ user.display_name }}</strong><small>SUPER ADMIN</small></div>
        <form action="/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="icon-button" aria-label="退出登录" title="退出登录">↗</button>
        </form>
      </div>
    </aside>
    <main class="main-content">
      <header class="mobile-header">
        <a class="brand compact" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span><strong>Moon</strong></a>
        <span class="readonly-pill">只读监管</span>
      </header>
      <div id="data-freshness" class="data-freshness" role="status" aria-live="polite">正在加载…</div>
      {% block content %}{% endblock %}
    </main>
  </div>
  <nav class="mobile-nav" aria-label="移动端导航">
    <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">总览</a>
    <a href="/market" class="{% if active_page == 'market' %}active{% endif %}">行情</a>
    <a href="/trading" class="{% if active_page == 'trading' %}active{% endif %}">开关</a>
    <a href="/trades" class="{% if active_page == 'trades' %}active{% endif %}">交易</a>
    <a href="/accounts" class="{% if active_page == 'accounts' %}active{% endif %}">账户</a>
    <a href="/system" class="{% if active_page == 'system' %}active{% endif %}">系统</a>
  </nav>
</body>
</html>
