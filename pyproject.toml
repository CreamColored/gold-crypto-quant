[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gold-crypto-quant"
version = "0.1.0"
description = "Paper-trading research system for crypto futures and XAU/USD."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "pydantic-settings>=2.14,<3",
    "pymysql[rsa]>=1.2,<2",
    "psutil>=7.2,<8",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6.4,<7",
    "uvicorn[standard]>=0.35,<1",
]

# vectorbt 只有 backtest/ 模块在用，而三个线上服务一行都不加载（cli.py 已改成惰性
# 导入，risk/qualification.py 的类型标注改成 TYPE_CHECKING）。它会拖进 numba、
# llvmlite、scipy、plotly 共约 330 MB——部署机器磁盘只有 8.4 G，没必要为跑服务
# 装下整套回测依赖。
#
# 本机开发：pip install -e ".[dev,backtest]"
# 服务器：  pip install -e .

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]
backtest = ["vectorbt>=1.1,<2"]

[project.scripts]
gold-crypto-quant = "gold_crypto_quant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_crypto_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/gold_crypto_quant/web/app.py" = ["B008"]
